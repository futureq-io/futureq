# FutureQ built-in defaults. Copy to config.yaml and adjust for your node.
# Scalar keys use FUTUREQ_ environment overrides, for example:
# api.grpc.listen -> FUTUREQ_API_GRPC_LISTEN.
# joinSeeds accepts a comma-separated list; initialMembers accepts a YAML map.
# Sizes use B, KiB, MiB, or GiB. Durations use Go units such as ms, s, or m.
configVersion: 1

api:
  grpc:
    listen: "0.0.0.0:8443"
    # Required for clustering: a client-reachable address, never 0.0.0.0.
    advertise: ""
    maxConcurrentStreams: 10
    maxReceiveMessageSize: 100KiB
    maxSendMessageSize: 100KiB
    keepaliveTimeout: 5s

cluster:
  enabled: false
  nodeId: 1
  shardId: 1
  # Seeds are gRPC addresses used only when a new node joins a cluster.
  joinSeeds: []
  raft:
    listen: "0.0.0.0:50005"
    # Required for clustering: an address reachable by other nodes.
    advertise: ""
    dataDir: "./raft-data"
    # List members when bootstrapping; leave empty when joining.
    initialMembers: {}
    rtt: 200ms
    snapshotEntries: 10000
    compactionOverhead: 5000

storage:
  engine: pebble
  pebble:
    # memory uses a virtual filesystem and discards data on exit.
    mode: disk
    dataDir: "./data"
    walEnabled: true
    cacheSize: 16MiB
    memtableSize: 64MiB
  # Used only when engine is bolt. Bolt always writes a file.
  bolt:
    file: "./data/futureq.db"
    bucket: futureq

publish:
  minAckLevel: quorum # quorum, leader, or noAck
  proposalTimeout: 5s

delivery:
  consumerQueueSize: 1024 # 1..65536 messages per consumer sender queue
  timeBucket: 1ms
  dispatchPollInterval: 5ms
  inFlightTimeout: 5s
  deleteBatchInterval: 500ms
  ttlSweepInterval: 1m0s
  # Each topic gets one bounded chunk at a time, with cyclic cursor wrap.
  prepareBatchSize: 64 # 1..64 candidates; new Raft command tag 4
  prepareBatchBytes: 256KiB # command cap and local scan byte budget
  scanMaxKeys: 256 # includes remote owners, in-flight keys, and skipped keys
  scanWorkBudget: 5ms # local work only; iterators close before proposal waits
  prepareTimeout: 250ms # uncertain completion is retried idempotently
  prepareWorkers: 2 # bounded jobs; at most one per topic

observability:
  logging:
    level: info # debug, info, warn, error, or fatal
  metrics:
    listen: "0.0.0.0:9090" # empty disables metrics and /healthz
