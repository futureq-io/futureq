# FutureQ built-in defaults. Copy to config.yaml and adjust for your node.
# Scalar keys use FUTUREQ_ environment overrides, for example:
# api.grpc.listen -> FUTUREQ_API_GRPC_LISTEN.
# joinSeeds accepts a comma-separated list; initialMembers accepts a YAML map.
# Sizes use B, KiB, MiB, or GiB. Durations use Go units such as ms, s, or m.
configVersion: 1

api:
  grpc:
    listen: "0.0.0.0:8443"
    # Required for clustering: a client-reachable address, never 0.0.0.0.
    advertise: ""
    maxConcurrentStreams: 10
    maxReceiveMessageSize: 100KiB
    maxSendMessageSize: 100KiB
    keepaliveTimeout: 5s
    maxConnectionIdle: 30s
    maxConnectionAge: 0s
    maxConnectionAgeGrace: 0s

cluster:
  enabled: false
  nodeId: 1
  shardId: 1
  # Seeds are gRPC addresses used only when a new node joins a cluster.
  joinSeeds: []
  raft:
    listen: "0.0.0.0:50005"
    # Required for clustering: an address reachable by other nodes.
    advertise: ""
    dataDir: "./raft-data"
    # List members when bootstrapping; leave empty when joining.
    initialMembers: {}
    rtt: 200ms
    snapshotEntries: 10000
    compactionOverhead: 5000
    logDB:
      # Engine.ExecShards controls workers that persist Raft updates.
      # Changing workers/shards requires fresh Raft storage.
      workers: 16
      shards: 16
      kvKeepLogFileNum: 16
      kvMaxBackgroundCompactions: 2
      kvMaxBackgroundFlushes: 2
      kvLRUCacheSize: 0B
      # Tan retains 16 buffers regardless of workers: 256MiB at this default.
      # Oversized updates allocate a larger temporary buffer as needed.
      kvWriteBufferSize: 16MiB
      kvMaxWriteBufferNumber: 4
      kvLevel0FileNumCompactionTrigger: 8
      kvLevel0SlowdownWritesTrigger: 17
      kvLevel0StopWritesTrigger: 24
      kvMaxBytesForLevelBase: 4GiB
      kvMaxBytesForLevelMultiplier: 2
      kvTargetFileSizeBase: 16MiB
      kvTargetFileSizeMultiplier: 2
      kvLevelCompactionDynamicLevelBytes: 0
      kvRecycleLogFileNum: 0
      kvNumOfLevels: 7
      kvBlockSize: 32KiB
      saveBufferSize: 32KiB
      maxSaveBufferSize: 64MiB

storage:
  engine: pebble
  # Virtual delivery shards for clustered publishes.
  virtualShards: 256 # A power of two from 1 through 65536
  pebble:
    # memory uses a virtual filesystem and discards data on exit.
    mode: disk
    dataDir: "./data"
    walEnabled: true
    cacheSize: 16MiB
    memtableSize: 64MiB
    compactionConcurrency: 1 # Normal and upper compaction concurrency; delete-only compactions may exceed it.
  # Used only when engine is bolt. Bolt always writes a file.
  # BOLT IS FOR INTERNAL EXPERIMENTAL TESTING AND NOT PRODUCTION READY
  bolt:
    file: "./data/futureq.db"
    bucket: futureq

publish:
  minAckLevel: quorum # quorum, leader, or noAck
  proposalTimeout: 5s
  batchMaxRequests: 1 # 1 disables standalone grouping
  batchMaxBytes: 1MiB
  batchMaxWait: 1ms
  maxPendingRequests: 256

delivery:
  # consumerCount weights by workers. replicaCount gives each serving replica equal weight.
  shardDistribution: consumerCount
  heapType: binary # binary, 4ary, or 8ary; restart to change
  subscriptions:
    allowAutoAck: false # reject auto-ack streams unless explicitly allowed
    # No workers connected for this duration: discard the subscription/backlog.
    # 0s retains group and universal interests forever; message TTL still applies.
    disconnectTimeout: 0s
    renewalWorkers: 4 # 1..16 concurrent renewal batches, up to 256 sessions each
    disconnectWorkers: 1 # 1..16 concurrent disconnect batches; shared bounded queue
  discoveryWorkers: 2 # 1..16 concurrent topic discovery passes
  shardWorkers: 1 # Concurrent scans per sharded topic pass
  preloadScanIdleMaxInterval: 0s # 0 disables speculative idle backoff; due scans keep their poll cadence
  consumerQueueSize: 1024 # 1..65536 messages per consumer sender queue
  timeBucket: 1ms
  dispatchPollInterval: 5ms
  preloadLookahead: 0s # future caching is opt-in; try 100ms after workload evaluation
  preloadMaxMessages: 512 # global full-message future-cache cap; 0 disables future caching
  inFlightTimeout: 5s
  readPermit: 1s # Raft delivery authorization from quorum-read start; 100ms..30s, whole milliseconds
  deleteBatchInterval: 500ms
  deleteWorkers: 16 # 1..256 concurrent ACK/delete flushes in Raft mode; standalone stays serial
  ackQueueCapacity: 8192 # 1..1048576 unique pending recipient ACKs per broker, including proposals in progress
  receiptCache:
    maxBytes: 64MiB # Per broker in standalone mode or per Raft replica. Use 0B to disable.
    maxEntries: 524288 # Power of two. Slot table memory is additional.
  consumerRemovalWorkers: 1 # 1..16 concurrent Raft consumer membership removals
  ttlSweepInterval: 1m0s
  # Each topic gets one bounded chunk at a time, with cyclic cursor wrap.
  prepareBatchSize: 64 # 1..256 candidates; new Raft command tag 4
  prepareBatchBytes: 256KiB # command cap and local scan byte budget
  scanMaxKeys: 256 # includes remote owners, in-flight keys, and skipped keys
  scanWorkBudget: 5ms # local work only; iterators close before proposal waits
  validationTimeout: 250ms # cooperative deadline for payload validation and receipt reads
  deliveryWorkers: 2 # bounded delivery jobs; at most one per topic

observability:
  logging:
    level: info # debug, info, warn, error, or fatal
  metrics:
    listen: "0.0.0.0:9090" # empty disables metrics and /healthz
