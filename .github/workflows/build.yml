name: Build

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...
