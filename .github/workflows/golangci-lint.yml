name: golangci-lint
on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
